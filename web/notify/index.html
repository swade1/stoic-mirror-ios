<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Be first to try The Stoic Mirror, a Stoic-quotes app grounded in Marcus Aurelius, Epictetus, and Seneca. Coming soon.">
<title>Be first to try The Stoic Mirror</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Source+Serif+4:wght@400;600&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#0f0e0c; --surface:#1a1814; --border:#3d3830;
    --gold:#c9b97a; --gold-bright:#ddc98f; --gold-deep:#8f7a45;
    --text:#f0ead6; --muted:#a89f88; --dim:#8a7e6e;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 24px; background:var(--bg); color:var(--text);
    font-family:"Source Serif 4",Georgia,serif; font-size:1.2rem; line-height:1.6; text-align:center;
  }
  main{ width:100%; max-width:520px; }
  .mark{ width:72px; height:72px; border-radius:16px; margin:0 auto 28px; display:block; }
  .brand{ font-family:ui-monospace,Menlo,monospace; font-size:.8rem; letter-spacing:.2em; text-transform:uppercase; color:var(--gold-deep); margin-bottom:18px; }
  h1{ font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:clamp(2rem,7vw,2.8rem); line-height:1.12; margin:0 0 16px; }
  .lead{ color:var(--muted); margin:0 0 32px; }
  form{ display:flex; flex-direction:column; gap:12px; }
  input[type=email]{
    width:100%; font:inherit; font-size:1.1rem; color:var(--text); background:var(--surface);
    border:1px solid var(--border); border-radius:3px; padding:15px 16px; text-align:center;
  }
  input[type=email]::placeholder{ color:var(--dim); }
  input[type=email]:focus{ outline:none; border-color:var(--gold); }
  button{
    font-family:ui-monospace,Menlo,monospace; font-size:1.05rem; letter-spacing:.06em; text-transform:uppercase;
    padding:16px 28px; border:0; border-radius:3px; cursor:pointer; font-weight:600; color:#201b10;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));
  }
  button:disabled{ opacity:.6; cursor:wait; }
  .hp{ position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  .msg{ min-height:1.6em; margin:16px 0 0; font-size:1.05rem; color:var(--muted); }
  .msg.ok{ color:var(--gold-bright); }
  .msg.err{ color:#d98b7a; }
  .fine{ margin:6px 0 0; font-size:.9rem; color:var(--dim); }
  .fine a, footer a{ color:inherit; }
  footer{ margin-top:48px; font-size:.9rem; color:var(--dim); }
  footer a{ margin:0 8px; }
</style>
</head>
<body>
<main>
  <img class="mark" src="/apple-touch-icon.png" alt="The Stoic Mirror">
  <div class="brand">The Stoic Mirror</div>
  <h1>Be first to try The Stoic Mirror.</h1>
  <p class="lead">A Stoic-quotes app, coming soon. Leave your email and I'll let you know when it's ready.</p>

  <form id="form" novalidate>
    <label class="hp" aria-hidden="true">Leave blank <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
    <input type="email" name="email" placeholder="you@example.com" aria-label="Email address" autocomplete="email" required maxlength="254">
    <button type="submit">Notify me</button>
  </form>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <p class="fine">Launch updates only. Never shared or sold. <a href="/unsubscribe.html">Unsubscribe</a> anytime.</p>
</main>

<footer>
  <a href="/">The Stoic Mirror</a> · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a>
</footer>

<script>
  (function(){
    var SUPABASE_URL = "https://fazvbphkzlutghzpvsli.supabase.co";
    var SUPABASE_KEY = "sb_publishable_erbTFZ8a6OIxaED3a3RL7Q_yz4XtDXX";
    var form = document.getElementById('form');
    var msg = document.getElementById('msg');
    function say(t, cls){ msg.textContent = t; msg.className = 'msg ' + (cls || ''); }
    form.addEventListener('submit', function(e){
      e.preventDefault();
      if (form.elements.website.value) return; // honeypot
      var email = form.elements.email.value.trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { say('Please enter a valid email address.', 'err'); return; }
      var btn = form.querySelector('button'); btn.disabled = true; say('Saving…');
      fetch(SUPABASE_URL + '/functions/v1/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
        body: JSON.stringify({ email: email })
      }).then(function(r){
        if (!r.ok) throw new Error('http ' + r.status);
        form.elements.email.value = '';
        say("Thank you — I'll email you when the app is ready.", 'ok');
      }).catch(function(){
        say('Something went wrong. Please try again in a moment.', 'err');
      }).then(function(){ btn.disabled = false; });
    });
  })();
</script>
</body>
</html>
